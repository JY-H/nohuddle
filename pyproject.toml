[project]
name = "nfl-watcher"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "JY-H", email = "jiayan.a.hu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.65.2",
    "pyobjc-framework-quartz>=13.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=13.0 ; sys_platform == 'darwin'",
]

[project.scripts]
nfl-watcher = "nfl_watcher:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
